name: Build and verify desktop apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build, verify and package universal Mac app
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: QiaoQiao-macOS
          path: |
            dist/*.zip
            dist/*.sha256
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test, publish and launch Windows app
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QiaoQiao-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            artifacts/windows-smoke/
